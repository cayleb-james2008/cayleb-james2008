<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 171" width="326" height="171" role="img" aria-labelledby="t d"><title id="t">dotz, public repository on GitHub</title><desc id="d">dotz: Runs and supervises AI coding agents from a desktop app. 828+ core tests on each of Windows, macOS, Linux; all 6 hosted jobs pass; merged. Stack: Rust · Tauri · SQLite. Licence: MIT. Last pushed 2026-10-28.</desc><style>
