<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 153" width="326" height="153" role="img" aria-labelledby="t d"><title id="t">dotz, public repository on GitHub</title><desc id="d">dotz: A coding dashboard for directing work to a team of AI coding agents. Rust core, Tauri shell. Stack: Rust · Tauri. Licence: MIT. Last pushed 2026-10-28.</desc><style>
