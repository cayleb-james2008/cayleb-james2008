<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 135" width="326" height="135" role="img" aria-labelledby="t d"><title id="t">open-ro, public repository on GitHub</title><desc id="d">open-ro: Open-source, local-first AI development studio for Roblox projects. Just started. Licence: MIT. Last pushed 2026-11-06.</desc><style>
.s{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.k{font-size:12.5px;font-weight:700;letter-spacing:1.6px;fill:#a9a8a5}
.mu{fill:#a9a8a5}.tx{fill:#d6d4d0}.ac{fill:#a8855c}
.hl{stroke-dasharray:var(--len);stroke-dashoffset:0;animation:draw 1.3s cubic-bezier(.3,.7,.2,1) both}
.r{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
.g{animation:grow .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:50% 100%}
