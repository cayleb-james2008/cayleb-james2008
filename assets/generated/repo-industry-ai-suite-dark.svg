<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 414 153" width="414" height="153" role="img" aria-labelledby="t d"><title id="t">industry-ai-suite, public repository on GitHub</title><desc id="d">industry-ai-suite: Ten local review tools; every finding shows its source and a person decides. 382 Python tests pass. Stack: Python. Last pushed 2026-10-13.</desc><style>
