<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 280" width="326" height="280" role="img" aria-labelledby="t d"><title id="t">GitHub contributions, last 12 months</title><desc id="d">1,315 contributions from 2025-11-02 to 2026-11-07: 1,042 commits, 266 pull requests, 63 active days, 398 busiest day.</desc><style>
.s{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.k{font-size:12.5px;font-weight:700;letter-spacing:1.6px;fill:#B9BCAE}
.mu{fill:#B9BCAE}.tx{fill:#EDE6D6}.ac{fill:#DAB696}
.hl{stroke-dasharray:var(--len);stroke-dashoffset:0;animation:draw 1.3s cubic-bezier(.3,.7,.2,1) both}
.r{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
.g{animation:grow .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:50% 100%}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
