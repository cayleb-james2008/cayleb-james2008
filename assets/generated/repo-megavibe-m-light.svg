<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 153" width="326" height="153" role="img" aria-labelledby="t d"><title id="t">megavibe, public repository on GitHub</title><desc id="d">megavibe: A native Linux workspace for coding agents: terminals, notes, plans and on-device voice planning on one board. Stack: TypeScript · Tauri. Last pushed 2026-10-13.</desc><style>
.s{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.k{font-size:12.5px;font-weight:700;letter-spacing:1.6px;fill:#4f4f4f}
.mu{fill:#4f4f4f}.tx{fill:#121316}.ac{fill:#6a573f}
.hl{stroke-dasharray:var(--len);stroke-dashoffset:0;animation:draw 1.3s cubic-bezier(.3,.7,.2,1) both}
.r{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
.g{animation:grow .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:50% 100%}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
