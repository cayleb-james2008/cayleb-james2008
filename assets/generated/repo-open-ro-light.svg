<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 88" width="830" height="88" role="img" aria-labelledby="t d"><title id="t">open-ro, public repository on GitHub</title><desc id="d">open-ro: Open-source, local-first AI development studio for Roblox projects. Just started. Licence: MIT. Last pushed 2026-11-06.</desc><style>
